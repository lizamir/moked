<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פרווה: צ'אט עם העוזר</title>
<style>
  :root { --bg: #efe7dd; --me: #d9fdd3; --them: #ffffff; --head: #075e54; --ink: #111b21; --muted: #667781; --accent: #0e7a3f; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #d1d7db; color: var(--ink); display: grid; place-items: center; min-height: 100vh; }
  .phone { inline-size: min(420px, 100vw); block-size: min(860px, 100vh); background: var(--bg); display: flex; flex-direction: column; box-shadow: 0 20px 60px -20px rgba(0,0,0,.35); }
  header { background: var(--head); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  header .avatar { inline-size: 40px; block-size: 40px; border-radius: 50%; background: #f4c3d0; display: grid; place-items: center; font-weight: 800; color: #2c1520; }
  header small { display: block; opacity: .8; font-size: .8rem; }
  main { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-inline-size: 82%; padding: 7px 10px 8px; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; font-size: .97rem; box-shadow: 0 1px .5px rgba(0,0,0,.13); }
  .me { align-self: flex-start; background: var(--me); border-start-start-radius: 2px; }
  .them { align-self: flex-end; background: var(--them); border-start-end-radius: 2px; }
  .status { align-self: center; background: #fff8c5; font-size: .85rem; }
  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin-block-start: 6px; }
  .steps span { font-size: .72rem; background: #eef2f4; color: var(--muted); border-radius: 999px; padding: 1px 8px; }
  .buttons { display: flex; gap: 6px; margin-block-start: 8px; }
  .buttons button { flex: 1; min-block-size: 40px; border: 1px solid #d1d7db; background: #fff; color: #027eb5; border-radius: 8px; font: 600 .95rem system-ui; cursor: pointer; }
  .buttons button:disabled { opacity: .45; cursor: default; }
  .typing { align-self: flex-end; color: var(--muted); font-size: .85rem; padding: 4px 8px; }
  form { display: flex; gap: 8px; padding: 8px; background: #f0f2f5; }
  input { flex: 1; min-block-size: 44px; border: 0; border-radius: 22px; padding: 0 16px; font-size: 1rem; }
  form button { inline-size: 44px; block-size: 44px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; font-size: 1.1rem; cursor: pointer; }
  .note { text-align: center; font-size: .75rem; color: var(--muted); padding: 4px 8px 8px; background: #f0f2f5; }
</style>
</head>
<body>
<div class="phone">
  <header><div class="avatar">פ</div><div><b>פרווה</b><small>מספרה ופנסיון לכלבים · עוזר דיגיטלי</small></div></header>
  <main id="log" aria-live="polite"></main>
  <form id="form"><input id="text" autocomplete="off" placeholder="הודעה" aria-label="הודעה"><button aria-label="שליחה">➤</button></form>
  <p class="note">שיחה אמיתית עם הסוכן. תורים ומיילים נשמרים בתיקייה data/runtime במחשב הזה.</p>
</div>
<script>
const LABELS = { search_knowledge_base: "חיפוש במאגר", web_search: "חיפוש באינטרנט", check_availability: "בדיקת יומן", book_appointment: "קביעת תור", send_email: "שליחת מייל", log_request: "רישום פנייה", read_document: "קריאת מסמך" };
const session = sessionStorage.getItem("moked-session") || crypto.randomUUID();
try { sessionStorage.setItem("moked-session", session); } catch {}
const log = document.getElementById("log");
let next = 0, waiting = false;

function bubble(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.append(div);
  log.scrollTop = log.scrollHeight;
  return div;
}
function typing(on) {
  waiting = on;
  document.querySelector(".typing")?.remove();
  if (on) { const t = document.createElement("div"); t.className = "typing"; t.textContent = "מקליד/ה…"; log.append(t); log.scrollTop = log.scrollHeight; }
}
async function send(text) {
  bubble("me", text);
  typing(true);
  await fetch("/api/message", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ session, text }) });
}
function render(event) {
  typing(false);
  if (event.kind === "status") return bubble("status", event.text);
  const div = bubble("them", event.text);
  if (event.kind === "text") {
    const tools = [...new Set(event.steps.map((s) => (LABELS[s.tool] || s.tool) + (s.outcome === "declined" ? " (בוטל)" : "")))];
    if (tools.length) { const row = document.createElement("div"); row.className = "steps"; tools.forEach((t) => { const s = document.createElement("span"); s.textContent = t; row.append(s); }); div.append(row); }
  }
  if (event.kind === "approval") {
    const row = document.createElement("div"); row.className = "buttons";
    for (const [label, reply] of [["כן, לאשר", "כן"], ["לא", "לא"]]) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = label;
      b.onclick = () => { row.querySelectorAll("button").forEach((x) => (x.disabled = true)); send(reply); };
      row.append(b);
    }
    div.append(row);
  }
}
async function poll() {
  try {
    const r = await fetch(`/api/events?session=${session}&after=${next}`);
    const { events, next: n } = await r.json();
    next = n; events.forEach(render);
    if (waiting && events.length === 0) typing(true);
  } catch {}
  setTimeout(poll, 700);
}
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (text) { input.value = ""; send(text); }
});
bubble("them", "היי! אני העוזר הדיגיטלי של פרווה 🐶 אפשר לשאול על מחירים, חיסונים ושעות, או לקבוע תור למספרה.");
poll();
</script>
</body>
</html>
