name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Embedding model weights (~120 MB) and computed vectors.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/@huggingface/transformers/.cache
            .cache
          key: embeddings-${{ hashFiles('package-lock.json', 'business/**') }}
          restore-keys: embeddings-
      - run: npm run typecheck
      - run: npm test
      - name: Retrieval eval (offline, gates on hybrid Recall@5)
        run: npm run eval:retrieval
      - name: Publish retrieval report
        if: always()
        run: cat evals/results/retrieval.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    # Builds the container image and checks that the chat really starts inside it.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t moked:ci .
      - name: Start the container and check it answers
        run: |
          # The key is a placeholder: the smoke test never calls Claude.
          docker run -d --name moked -p 3100:3100 -e ANTHROPIC_API_KEY=placeholder moked:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3100/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:3100/healthz
          curl -fsS http://localhost:3100/ | grep -qi "<html"
          # The app must not run as root inside the container.
          test "$(docker exec moked id -u)" != "0"
      - name: Container logs
        if: always()
        run: docker logs moked || true

  agent-eval:
    # Calls the Claude API, so it only runs where the secret is available (not on fork PRs).
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Agent eval (20 scenarios, gates on pass rate)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run eval:agent
      - name: Publish agent report
        if: always() && env.ANTHROPIC_API_KEY != ''
        run: cat evals/results/agent.md >> "$GITHUB_STEP_SUMMARY"
